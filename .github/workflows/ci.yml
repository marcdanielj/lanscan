name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        # 'stable' rather than a pin: Go 1.22's -race output trips the dyld
        # linker on current macOS runners. go.mod still declares 1.22, so the
        # compiler keeps enforcing that as the language floor.
        with: { go-version: 'stable' }
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
